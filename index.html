<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Para ti</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Figtree:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --wine: #240814;
            --wine2: #4a0f2b;
            --rose: #ff6b9a;
            --gold: #ffd9a0;
            --ink: #fff1f4;
            --soft: #d9a9bb;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            height: 100%;
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--wine);
            color: var(--ink);
            font-family: 'Figtree', system-ui, sans-serif;
            overflow-x: hidden
        }

        body.lock {
            overflow: hidden;
            height: 100%
        }

        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1
        }

        section {
            position: relative;
            z-index: 2;
            padding: 80px 22px;
            max-width: 760px;
            margin: 0 auto;
            text-align: center
        }

        .d {
            font-family: 'Syne', Impact, sans-serif;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic
        }

        /* intro */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 40%, var(--wine2), var(--wine) 70%);
            transition: opacity 1.2s ease, visibility 1.2s;
            cursor: pointer;
            border: 0;
            width: 100%;
            color: inherit;
            font: inherit
        }

        #intro.gone {
            opacity: 0;
            visibility: hidden
        }

        .env {
            position: relative;
            width: min(78vw, 320px);
            aspect-ratio: 1.5;
            background: #7a1e45;
            border-radius: 10px;
            box-shadow: 0 30px 80px rgba(255, 107, 154, .25);
            animation: float 3.5s ease-in-out infinite
        }

        .env::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, transparent 49%, rgba(0, 0, 0, .18) 50%) left/50% 100% no-repeat, linear-gradient(225deg, transparent 49%, rgba(0, 0, 0, .18) 50%) right/50% 100% no-repeat
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56%;
            background: #9a2a5a;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-radius: 10px 10px 0 0
        }

        .seal {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 62px;
            height: 62px;
            margin: -31px 0 0 -31px;
            border-radius: 50%;
            background: var(--rose);
            display: grid;
            place-items: center;
            font-size: 30px;
            color: var(--wine);
            box-shadow: 0 0 30px var(--rose);
            animation: beat 1.4s infinite
        }

        .tap {
            margin-top: 34px;
            color: var(--soft);
            font-size: 1.05rem
        }

        .introin {
            text-align: center
        }

        @keyframes float {
            50% {
                transform: translateY(-12px)
            }
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1)
            }

            15% {
                transform: scale(1.18)
            }

            30% {
                transform: scale(1)
            }

            45% {
                transform: scale(1.12)
            }
        }

        /* hero */
        #hero {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .hi {
            font-size: 1.6rem;
            color: var(--gold);
            margin: 0 0 10px
        }

        h1 {
            font-size: clamp(3.4rem, 17vw, 7.5rem);
            line-height: .9;
            margin: 0;
            background: linear-gradient(180deg, #fff, var(--rose) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .clock {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 38px;
            flex-wrap: wrap
        }

        .u {
            min-width: 72px;
            padding: 14px 10px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 217, 160, .25);
            backdrop-filter: blur(6px)
        }

        .u b {
            display: block;
            font-family: 'Syne', sans-serif;
            font-size: 1.9rem;
            font-variant-numeric: tabular-nums
        }

        .u span {
            font-size: .8rem;
            color: var(--soft)
        }

        .cap {
            margin-top: 16px;
            color: var(--soft)
        }

        .down {
            margin-top: 40px;
            font-size: 1.8rem;
            color: var(--rose);
            animation: float 2s infinite
        }

        /* letter */
        .paper {
            padding: 34px 26px;
            border-radius: 6px;
            background: linear-gradient(160deg, #fff4e6, #ffe3d1);
            color: #4a1a2b;
            text-align: left;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
            transform: rotate(-1deg);
            min-height: 340px
        }

        .paper .serif {
            font-size: clamp(1.25rem, 4.6vw, 1.6rem);
            line-height: 1.55;
            white-space: pre-wrap;
            margin: 0
        }

        .caret {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #b3224f;
            vertical-align: -.15em;
            animation: bl 1s steps(2) infinite
        }

        @keyframes bl {
            50% {
                opacity: 0
            }
        }

        h2 {
            font-size: clamp(1.9rem, 8vw, 3rem);
            margin: 0 0 10px;
            line-height: 1.05
        }

        .lead {
            color: var(--soft);
            margin: 0 0 34px
        }

        /* cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px
        }

        .c {
            perspective: 900px;
            aspect-ratio: 1/1.05;
            border: 0;
            background: none;
            padding: 0;
            cursor: pointer;
            color: inherit;
            font: inherit
        }

        .c:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
            border-radius: 20px
        }

        .in {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .7s cubic-bezier(.3, 1.2, .4, 1);
            transform-style: preserve-3d
        }

        .c.f .in {
            transform: rotateY(180deg)
        }

        .fa,
        .fb {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        .fa {
            background: linear-gradient(150deg, var(--wine2), #7a1e45);
            border: 1px solid rgba(255, 217, 160, .3);
            font-size: 2.6rem
        }

        .fa small {
            font-family: 'Figtree', sans-serif;
            font-size: .9rem;
            color: var(--gold);
            margin-top: 8px
        }

        .fb {
            transform: rotateY(180deg);
            background: linear-gradient(150deg, #ff6b9a, #ffa07a);
            color: #3b0a20;
            font-size: 1.25rem;
            line-height: 1.3;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600
        }

        /* final */
        #fin {
            min-height: 90svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center
        }

        .btns {
            position: relative;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            min-height: 120px;
            width: 100%
        }

        button.yes {
            font: 800 1.3rem 'Syne', sans-serif;
            padding: 16px 38px;
            border: 0;
            border-radius: 999px;
            background: var(--rose);
            color: var(--wine);
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 107, 154, .6);
            transition: transform .2s
        }

        button.yes:hover {
            transform: scale(1.07)
        }

        button.no {
            font: 500 1rem 'Figtree', sans-serif;
            padding: 12px 22px;
            border-radius: 999px;
            background: transparent;
            color: var(--soft);
            border: 1px solid var(--soft);
            cursor: pointer;
            transition: left .25s, top .25s
        }

        button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px
        }

        #yesmsg {
            display: none
        }

        #yesmsg.show {
            display: block;
            animation: rise 1.2s ease both
        }

        #yesmsg h2 {
            font-size: clamp(3rem, 15vw, 6rem);
            background: linear-gradient(180deg, #fff, var(--rose));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.9)
            }
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--soft);
            padding: 10px 0 50px
        }

        .paper {
            cursor: pointer
        }

        .paper:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 4px
        }

        #player {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 1px;
            height: 1px;
            opacity: .01;
            overflow: hidden;
            pointer-events: none
        }

        #player iframe {
            display: block;
            width: 1px;
            height: 1px;
            border: 0
        }

        #ctl {
            position: fixed;
            right: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 6;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 16px 6px 6px;
            border-radius: 999px;
            border: 1px solid rgba(255, 217, 160, .45);
            background: rgba(36, 8, 20, .88);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5)
        }

        #ctl.on {
            display: flex
        }

        #ctl.solo {
            padding: 6px
        }

        #ctl.solo #vol {
            display: none
        }

        #mute {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 0;
            background: rgba(255, 255, 255, .08);
            color: var(--ink);
            font-size: 1.3rem;
            cursor: pointer
        }

        #vol {
            width: 110px;
            accent-color: var(--rose);
            cursor: pointer
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

            html {
                scroll-behavior: auto
            }
        }
    </style>
</head>

<body class="lock">
    <canvas id="fx"></canvas>

    <button id="intro" aria-label="Abrir sobre">
        <div class="introin">
            <div class="env">
                <div class="flap"></div>
                <div class="seal">♥</div>
            </div>
            <div class="tap serif" style="font-size:1.5rem">Tengo algo para ti. Ábrelo.</div>
        </div>
    </button>

    <section id="hero">
        <p class="hi serif" id="hi"></p>
        <h1 class="d" id="nm"></h1>
        <div class="clock" aria-label="Tiempo juntos">
            <div class="u"><b id="cd">0</b><span>días</span></div>
            <div class="u"><b id="ch">0</b><span>horas</span></div>
            <div class="u"><b id="cm">0</b><span>minutos</span></div>
            <div class="u"><b id="cs">0</b><span>segundos</span></div>
        </div>
        <p class="cap serif" style="font-size:1.3rem">y cada segundo contigo vale la pena.</p>
        <div class="down" aria-hidden="true">↓</div>
    </section>

    <section id="letter">
        <h2 class="d">Una carta para ti</h2>
        <p class="lead">Léela despacito.</p>
        <div class="paper" id="paper" role="button" tabindex="0" aria-label="Poner la canción">
            <p class="serif" id="txt" aria-live="off"></p>
        </div>
        <div id="player" aria-hidden="true"></div>
        <div id="ctl"><button id="mute" aria-label="Silenciar canción" aria-pressed="false">🔊</button><input id="vol"
                type="range" min="0" max="100" value="50" aria-label="Volumen"></div>
    </section>

    <section id="why">
        <h2 class="d">Por qué te amo</h2>
        <p class="lead">Toca cada tarjeta.</p>
        <div class="grid" id="grid"></div>
    </section>

    <section id="fin">
        <div id="ask">
            <h2 class="d" id="q"></h2>
            <div class="btns" id="btns">
                <button class="yes" id="yes">Sí, siempre</button>
                <button class="no" id="no">No</button>
            </div>
        </div>
        <div id="yesmsg">
            <h2 class="d">Te amo</h2>
            <p class="serif" style="font-size:1.6rem;color:var(--gold)" id="last"></p>
        </div>
    </section>
    <footer class="serif">Hecho con todo mi amor, solo para ti.</footer>

    <script>
        /* ===== EDITA AQUÍ ===== */
        const NOMBRE = "Mi amor";                   // su nombre
        const DESDE = "2026-07-06T00:00:00";       // inicio de la relación
        const FIRMA = "Alan de Agatita";                  // cómo firmas
        const CARTA = `Hola, mi vida.

Hice esta página pensando en ti, porque quería decirte con algo especial lo mucho que significas para mí.

Contigo los días normales se sienten especiales. Me haces reír, me haces sentir en casa y me haces querer ser mejor cada día.

No sé qué tenga el futuro, pero sí sé que quiero que tú estés en él.

Te amo, más de lo que sé explicar.

${FIRMA}`;
        const RAZONES = [
            ["😂", "Tu risa", "Es mi sonido favorito del mundo."],
            ["🏠", "Tu forma de hacerme sentir en casa", "Contigo estoy tranquilo, donde sea."],
            ["✨", "Cómo eres con todos", "Tu corazón es de lo más bonito que tienes."],
            ["💪", "Tu fuerza", "Me inspiras más de lo que te imaginas."],
            ["🥹", "Tus detalles", "Los pequeños, los que nadie ve."],
            ["💞", "Todo tú", "Aunque me faltaran palabras, te amo."]
        ];
        const PREGUNTA = "¿Pasamos una vida juntos?";
        const ULTIMO = "Gracias por ser mi persona favorita.";
        /* ======================= */

        const $ = id => document.getElementById(id);
        $('hi').textContent = "esto es para ti,"; $('nm').textContent = NOMBRE; $('q').textContent = PREGUNTA; $('last').textContent = ULTIMO;
        const t0 = new Date(DESDE).getTime();
        function tick() {
            let s = Math.max(0, Math.floor((Date.now() - t0) / 1000));
            $('cd').textContent = Math.floor(s / 86400); $('ch').textContent = Math.floor(s % 86400 / 3600);
            $('cm').textContent = Math.floor(s % 3600 / 60); $('cs').textContent = s % 60;
        }
        tick(); setInterval(tick, 1000);

        RAZONES.forEach(([e, t, m]) => {
            const b = document.createElement('button'); b.className = 'c';
            b.innerHTML = '<div class="in"><div class="fa"><span></span><small></small></div><div class="fb"></div></div>';
            b.querySelector('.fa span').textContent = e; b.querySelector('small').textContent = t; b.querySelector('.fb').textContent = m;
            b.onclick = () => b.classList.toggle('f'); $('grid').appendChild(b);
        });

        /* canvas: corazones flotantes + confeti */
        const cv = $('fx'), cx = cv.getContext('2d'); let W, H, P = [];
        const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        function rs() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio } rs(); addEventListener('resize', rs);
        const cols = ['#ff6b9a', '#ffd9a0', '#ff9ebb', '#ffffff', '#ffa07a'];
        function heart(burst, x, y) {
            const k = devicePixelRatio;
            return {
                x: x ?? Math.random() * W, y: y ?? H + 30 * k, s: (8 + Math.random() * 22) * k, vy: burst ? (-6 - Math.random() * 9) * k : (-.4 - Math.random() * .9) * k,
                vx: burst ? (Math.random() - .5) * 12 * k : (Math.random() - .5) * .4 * k, g: burst ? .18 * k : 0, a: burst ? 1 : .15 + Math.random() * .4, c: cols[Math.random() * 5 | 0], ph: Math.random() * 6, burst
            };
        }
        function loop() {
            cx.clearRect(0, 0, W, H);
            if (!still && P.length < 26 && Math.random() < .06) P.push(heart(false));
            P = P.filter(p => {
                p.x += p.vx + (p.burst ? 0 : Math.sin(p.ph += .02) * .4 * devicePixelRatio); p.y += p.vy; p.vy += p.g; if (p.burst) p.a -= .007;
                cx.globalAlpha = Math.max(p.a, 0); cx.fillStyle = p.c; cx.font = p.s + 'px serif'; cx.fillText('♥', p.x, p.y);
                return p.a > 0 && p.y > -60 * devicePixelRatio && p.y < H + 80 * devicePixelRatio;
            });
            requestAnimationFrame(loop);
        } loop();

        /* sobre */
        $('intro').onclick = () => {
            $('intro').classList.add('gone'); document.body.classList.remove('lock'); playSong();
            const k = devicePixelRatio; for (let i = 0; i < 40; i++) P.push(heart(true, W / 2, H / 2));
        };

        /* carta: máquina de escribir al entrar en vista */
        let typed = false;
        new IntersectionObserver((es, o) => {
            if (es[0].isIntersecting && !typed) {
                typed = true; o.disconnect();
                const el = $('txt'); if (still) { el.textContent = CARTA; return; }
                el.innerHTML = '<span class="caret"></span>'; let i = 0; const c = el.querySelector('.caret');
                (function w() { if (i < CARTA.length) { c.insertAdjacentText('beforebegin', CARTA[i++]); setTimeout(w, /[.,\n]/.test(CARTA[i - 1]) ? 260 : 38); } else c.remove(); })();
            }
        }, { threshold: .4 }).observe($('letter'));

        /* canción: arranca al tocar la carta (los navegadores exigen un toque para dar play) */
        const SONG = "KpiDd0Ua9_Y";
        const YT = "https://www.youtube.com/watch?v=" + SONG;
        let playing = false, muted = false;
        function ytCmd(func, args) {
            const f = $('player').querySelector('iframe');
            if (f) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || '' }), '*');
        }
        function paint() {
            const m = $('mute'); m.textContent = muted ? '🔇' : '🔊'; m.setAttribute('aria-pressed', muted);
            m.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar canción');
        }
        function playSong() {
            if (playing) return; playing = true;
            const ctl = $('ctl'), m = $('mute'), v = $('vol'); ctl.classList.add('on');
            if (location.protocol === 'file:') { ctl.classList.add('solo'); m.textContent = '🎵'; m.setAttribute('aria-label', 'Abrir la canción en YouTube'); m.onclick = () => window.open(YT, '_blank', 'noopener'); return; }
            const origin = encodeURIComponent(location.origin);
            $('player').innerHTML = '<iframe src="https://www.youtube.com/embed/' + SONG + '?autoplay=1&loop=1&playlist=' + SONG + '&playsinline=1&controls=0&enablejsapi=1&origin=' + origin + '" title="Nuestra canción" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
            const setVol = () => ytCmd('setVolume', [+v.value]);
            $('player').querySelector('iframe').addEventListener('load', () => { setVol(); setTimeout(setVol, 600); setTimeout(setVol, 1800); });
            m.onclick = () => { muted = !muted; ytCmd(muted ? 'mute' : 'unMute'); paint(); };
            v.oninput = () => { setVol(); if (muted && +v.value > 0) { muted = false; ytCmd('unMute'); paint(); } };
        }
        $('paper').addEventListener('click', playSong);
        $('paper').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playSong(); } });

        /* botón "No" que huye */
        const no = $('no'), box = $('btns');
        function dodge(e) {
            e.preventDefault(); const r = box.getBoundingClientRect();
            no.style.position = 'absolute'; no.style.left = Math.random() * (r.width - no.offsetWidth) + 'px'; no.style.top = Math.random() * (r.height - no.offsetHeight) + 'px';
        }
        no.addEventListener('pointerenter', dodge); no.addEventListener('touchstart', dodge, { passive: false }); no.addEventListener('click', dodge);

        $('yes').onclick = () => {
            $('ask').style.display = 'none'; $('yesmsg').classList.add('show');
            for (let i = 0; i < 120; i++) setTimeout(() => P.push(heart(true, Math.random() * W, H * .9)), i * 18);
        };
    </script>
</body>

</html>
